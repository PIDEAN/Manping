syntax = "proto3";
package bilibili.live.gift.v1;
// Subset of blivedm/models/pb.py, commit 3bf17fe862b8c2fc6bc04c81c3f0c5db95de93d6.
// Unknown fields are discarded by the bounded live-chat decoder.
message MedalInfo {
  int64 target_id = 1;
  int64 anchor_roomid = 4;
  int64 medal_level = 5;
  string medal_name = 6;
}
message BlindGift {
  string original_gift_name = 3;
  int64 original_gift_price = 6;
}
message GiftInfo { string img_basic = 1; }
message GiftItem {
  int64 gift_id = 1;
  string gift_name = 2;
  int64 num = 3;
  int64 gift_type = 4;
  int64 price = 5;
  int64 total_coin = 7;
  string coin_type = 8;
  string tid = 9;
  int64 timestamp = 10;
  string rnd = 12;
  string action = 18;
  GiftInfo gift_info = 35;
}
message SendGiftBroadcast {
  int64 uid = 1;
  string uname = 2;
  string face = 3;
  int64 guard_level = 5;
  MedalInfo medal_info = 8;
  BlindGift blind_gift = 9;
  repeated GiftItem gift_list = 10;
}
