name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  portable-core:
    # This subset exercises production sources even while Xcode 27 is unavailable.
    # AppKit, Metal, mpv and the full macOS suite still require build-and-test below.
    runs-on: ubuntu-latest
    container: swift:6.2@sha256:e508ef1e4be68087f720de622b91cbf1e32799a7aa96134b35e6f1a1d656db7a
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install test runner
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3
      - name: Portable Swift core tests (Release, offline)
        run: python3 scripts/portable_core_check.py
  build-and-test:
    # The package targets macOS 27 and Swift 6.4, so it needs Xcode 27. Until the hosted runners
    # ship it, the job reports that and skips; it starts building on its own once they do.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest installed Xcode
        id: xcode
        run: |
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          major=$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')
          if [ "$major" -ge 27 ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Xcode 27 required::This runner has Xcode $major; build and tests are skipped until macOS runners provide Xcode 27."
          fi
      - name: Build
        if: steps.xcode.outputs.supported == 'true'
        run: swift build
      - name: Swift tests (Core and App; offline fixtures only)
        if: steps.xcode.outputs.supported == 'true'
        run: swift test
      - name: Script tests
        run: |
          python3 scripts/diagnostic_checks_test.py
          python3 scripts/live_check_test.py
