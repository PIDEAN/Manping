name: privacy
on: [push, pull_request]
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check submitted commits, not GitHub's temporary PR merge identity.
          # The build workflow still tests the merge result.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: No personal data in tracked files or commit authors
        run: python3 scripts/privacy_check.py --authors
